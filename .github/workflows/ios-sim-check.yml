# Runs the app's native web view code in an iOS simulator (scripts/ios-sim-check) and stores
# the log and screenshots in the `ios-sim-results` branch. Only runs for pushes to the
# `ios-sim-check` branch: it is a debugging tool, not part of the app's build.
name: iOS simulator check

on:
  push:
    branches: [ios-sim-check]

permissions:
  contents: write

concurrency:
  group: ios-sim-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run
        run: bash scripts/ios-sim-check/run.sh > result.log 2>&1 || true
      - name: Store the results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir results
          cp result.log results/ || true
          cp -R shots results/ 2>/dev/null || true
          cd results
          git init -q
          git checkout -q -b ios-sim-results
          git config user.name "ios-sim-check"
          git config user.email "ios-sim-check@users.noreply.github.com"
          git add -A
          git commit -q -m "Results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ios-sim-results
