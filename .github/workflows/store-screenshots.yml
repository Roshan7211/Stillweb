# App Store screenshots from the real app in iPhone and iPad simulators
# (scripts/store-screenshots). Only runs for pushes to the `store-screenshots` branch; the
# images and the log go to the `store-screenshots-results` branch.
name: Store screenshots

on:
  push:
    branches: [store-screenshots]

permissions:
  contents: write

concurrency:
  group: store-screenshots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Run
        run: bash scripts/store-screenshots/run.sh > result.log 2>&1 || true
      - name: Store the results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir results
          cp result.log results/ || true
          cp -R out results/ 2>/dev/null || true
          cd results
          git init -q
          git checkout -q -b store-screenshots-results
          git config user.name "store-screenshots"
          git config user.email "store-screenshots@users.noreply.github.com"
          git add -A
          git commit -q -m "Results for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" store-screenshots-results
