<!-- Stillweb app icon (opaque, full-bleed; iOS rounds the corners itself). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1440" flood-opacity="0.35"/>
    </filter>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M402 498 A110 110 0 0 1 622 498 Z" fill="#000"/>
      <rect x="322" y="522" width="380" height="44" rx="22" fill="#000"/>
      <rect x="387" y="596" width="250" height="40" rx="20" fill="#000"/>
      <rect x="452" y="664" width="120" height="36" rx="18" fill="#000"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <path mask="url(#cut)" fill="url(#shield)"
          d="M330 214 H694 Q786 214 786 306 V512 C786 690 652 790 512 846 C372 790 238 690 238 512 V306 Q238 214 330 214 Z"/>
  </g>
</svg>
