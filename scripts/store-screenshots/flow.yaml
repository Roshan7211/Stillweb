# App Store screenshots, second pass: the privacy report and Plus, reached from the new tab
# page's counter (one tappable element), in light and dark.
appId: app.stillweb.browser
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Search or enter address"
    timeout: 60000
- tapOn: "Search or enter address"
- inputText: "https://www.bbc.com/news"
- pressKey: Enter
- extendedWaitUntil:
    visible: "never-shown-just-waiting"
    timeout: 15000
    optional: true
- tapOn:
    text: "Search or enter address"
    optional: true
- inputText: "https://edition.cnn.com"
- pressKey: Enter
- extendedWaitUntil:
    visible: "never-shown-just-waiting"
    timeout: 15000
    optional: true
- tapOn:
    text: "[0-9]+ tabs?"
    optional: true
- tapOn:
    text: "New tab"
    optional: true
- tapOn:
    text: "Cancel editing"
    optional: true
- waitForAnimationToEnd

# Light
- tapOn: ".*Open privacy report.*"
- waitForAnimationToEnd
- takeScreenshot: shots/06-report-light
- tapOn: ".*See Stillweb Plus.*"
- extendedWaitUntil:
    visible: ".*Restore Purchases.*"
    timeout: 20000
    optional: true
- takeScreenshot: shots/07-plus-light

# Dark: the app's own setting, then back to the new tab page.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Menu"
    timeout: 30000
- tapOn: "Menu"
- waitForAnimationToEnd
- tapOn: ".*Settings.*"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Address bar"
    direction: DOWN
    optional: true
- tapOn: "Dark"
- waitForAnimationToEnd
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Menu"
    timeout: 30000
- tapOn: ".*Open privacy report.*"
- waitForAnimationToEnd
- takeScreenshot: shots/09-report-dark
- tapOn: ".*See Stillweb Plus.*"
- extendedWaitUntil:
    visible: ".*Restore Purchases.*"
    timeout: 20000
    optional: true
- takeScreenshot: shots/10-plus-dark
