[package]
name = "adblock_jni"
version = "0.1.0"
edition = "2021"
publish = false
license = "MPL-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "filter-compiler"
path = "src/bin/filter_compiler.rs"
required-features = ["compiler"]

[features]
# Host-only tooling: converts filter lists to iOS WKContentRuleList JSON.
compiler = ["adblock/content-blocking"]

[dependencies]
# "single-thread" is left out of the defaults so Engine is Sync: Android's
# shouldInterceptRequest may run on several WebView IO threads at once.
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# adblock-rust with one patch (src/request.rs): network filters can match entity domains
# such as `domain=example.*`. MPL-2.0; see vendor/adblock/LICENSE.
[patch.crates-io]
adblock = { path = "vendor/adblock" }
