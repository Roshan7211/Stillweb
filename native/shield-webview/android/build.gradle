plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.shieldwebview'
version = '0.1.0'

android {
  namespace "expo.modules.shieldwebview"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  sourceSets {
    main {
      // Page-side scripts shared with iOS (web/shieldjs/*.js -> assets/shieldjs/), and
      // Calm Mode's cookie pop-up script (ios/Resources/vendor/autoconsent.js -> assets/).
      assets.srcDirs += ["${projectDir}/../web", "${projectDir}/../ios/Resources/vendor"]
    }
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "androidx.webkit:webkit:1.14.0"
  implementation "androidx.core:core-ktx:1.16.0"
  implementation "androidx.media:media:1.7.0"
}

// libadblock_jni.so is produced by scripts/build-rust-android.sh (npm run build:rust:android).
tasks.register("checkAdblockJni") {
  doLast {
    def lib = file("src/main/jniLibs/arm64-v8a/libadblock_jni.so")
    if (!lib.exists()) {
      throw new GradleException("Missing ${lib}. Run `npm run build:rust:android` first.")
    }
  }
}
preBuild.dependsOn("checkAdblockJni")
