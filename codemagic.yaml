# Codemagic: builds and signs the iOS app in the cloud and uploads it to TestFlight.
# Xcode is not installed on the machine this was written on, so this is how the iOS
# target gets compiled. Same setup as Lock Ring, Quiltdoku and Laundry Window.
#
# One-time setup in the Codemagic UI (none of it can live in the repository):
#
#   1. The App Store Connect API key named "AppStoreConnect" under
#      Team settings ▸ Team integrations ▸ Developer Portal (already used by the
#      other apps; `integrations.app_store_connect` refers to it by name).
#   2. The environment variable group `ios_signing` with the secure variable
#      CERTIFICATE_PRIVATE_KEY (shared, so one distribution certificate serves
#      every app on the team).
#   3. The bundle identifier app.stillweb.browser registered in the Apple
#      Developer account, and an App Store Connect app record using it.
#
# This is an Expo (Continuous Native Generation) project: ios/ is not committed and
# is generated by `expo prebuild` on every build. The ad-blocking module is a local
# Expo module in native/shield-webview; its iOS filter bundle is committed under
# native/shield-webview/ios/Resources/shield, so no Rust toolchain is needed here.
workflows:
  ios-testflight:
    name: iOS — build, sign, TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: AppStoreConnect

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: app.stillweb.browser
        XCODE_WORKSPACE: ios/Stillweb.xcworkspace
        XCODE_SCHEME: Stillweb

    scripts:
      - name: Install packages
        script: npm ci

      - name: Typecheck
        script: npx tsc --noEmit

      - name: Build number
        # $BUILD_NUMBER is Codemagic's counter for this workflow: every TestFlight
        # upload needs a higher build number than the last. Written into app.json
        # so prebuild puts it in Info.plist.
        script: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("app.json", "utf8"));
            config.expo.ios.buildNumber = String(process.env.BUILD_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(config, null, 2));
          '

      - name: Generate the iOS project
        # Also runs `pod install`.
        script: npx expo prebuild --platform ios --clean

      - name: Keychain
        script: keychain initialize

      - name: Certificate and provisioning profile
        # --create makes the profile (and certificate) on the first build of a new
        # bundle identifier; afterwards it only fetches them.
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Signing certificate into the keychain
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        # Also writes /Users/builder/export_options.plist for the build below.
        script: xcode-project use-profiles

      - name: Build the IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # TestFlight only: no App Store review, no release.
        submit_to_testflight: true
        # Once you have a tester group in App Store Connect, name it here and
        # every build reaches it automatically:
        # beta_groups:
        #   - Internal testers
